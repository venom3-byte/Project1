name: Forge Platform Builds
on:
  push:
    branches: [vision-live-direct-fix2-2026-09-30]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Web runtime
        run: node scripts/package-web-project.mjs --project packaging/sample-project.forge.json
      - name: Install Capacitor
        working-directory: packaging/android
        run: npm install
      - name: Create Android project
        working-directory: packaging/android
        run: npx cap add android
      - name: Sync Web runtime
        working-directory: packaging/android
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: packaging/android/android
        shell: bash
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-android-debug-apk
          path: packaging/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Web runtime
        run: node scripts/package-web-project.mjs --project packaging/sample-project.forge.json
      - name: Install Electron Forge
        working-directory: packaging/windows
        run: npm install
      - name: Build Windows package
        working-directory: packaging/windows
        run: npm run make
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-package
          path: packaging/windows/out/make/**
          if-no-files-found: error

  packaging-proof:
    runs-on: ubuntu-latest
    needs: [android, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare Web runtime
        run: node scripts/package-web-project.mjs --project packaging/sample-project.forge.json
      - name: Validate packaged runtime manifest
        run: node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('dist/forge-web/project.forge.json','utf8')); if(p.format!=='forge-project'||!fs.existsSync('dist/forge-web/index.html')||!fs.existsSync('dist/forge-web/build-info.json')) process.exit(1); console.log('Packaging manifest OK')"
      - name: Browser boot proof for packaged runtime
        run: npx playwright test tests/packaging-runtime.spec.mjs --project=desktop
      - name: Upload packaged runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: forge-packaged-runtime-proof
          path: test-results/packaged-runtime-proof.png
          if-no-files-found: error
