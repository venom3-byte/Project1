name: SubArab Live Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'subarab-live/**'
      - '.github/workflows/subarab-live-build.yml'
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: subarab-live
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: subarab-live-debug-apk
          path: subarab-live/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
