name: Asset Forge Vision QA

on:
  push:
    branches: [main, vision-control]
  pull_request:
  workflow_dispatch:

concurrency:
  group: asset-forge-vision-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install chromium

      - name: Install vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r vision-control/requirements.txt

      - name: Start Asset Forge server
        run: |
          nohup npm start > /tmp/asset-forge-server.log 2>&1 &
          for i in \$(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/asset-forge-server.log
          exit 1

      - name: Run visual browser QA
        run: python vision-control/qa_asset_forge.py http://127.0.0.1:4173/

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-forge-vision-evidence
          path: |
            tests/vision-verified/
            /tmp/asset-forge-server.log
          if-no-files-found: warn
