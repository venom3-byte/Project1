name: Forge Android Device Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Forge build dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Export Forge runtime
        run: node scripts/export-android.mjs android/demo-project.forge.json

      - name: Verify exported runtime
        run: node scripts/verify-android-package.mjs

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Assemble debug APK
        run: gradle -p android assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.venom3byte.forgegame
            adb shell monkey -p com.venom3byte.forgegame 1
            sleep 8
            adb shell pidof com.venom3byte.forgegame
            adb exec-out screencap -p > forge-android-screen.png

      - name: Upload device screenshot
        uses: actions/upload-artifact@v4
        with:
          name: forge-android-device-proof
          path: forge-android-screen.png
