name: Warfront RTS smoke checks

on:
  push:
    paths:
      - "public/warfront/**"
      - "mcp/warfront-browser-smoke.mjs"
      - ".github/workflows/warfront-smoke.yml"
  pull_request:
    paths:
      - "public/warfront/**"
      - "mcp/warfront-browser-smoke.mjs"
      - ".github/workflows/warfront-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    name: Static contract and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ES module syntax
        run: node --check public/warfront/game.js
      - name: Verify the standalone page contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          const htmlPath = 'public/warfront/index.html';
          const jsPath = 'public/warfront/game.js';
          const rosterPath = 'public/warfront/roster.json';
          const bundlePath = 'public/warfront/assets/combined-arms-r19.glb';
          const html = readFileSync(htmlPath, 'utf8');
          const js = readFileSync(jsPath, 'utf8');
          const roster = JSON.parse(readFileSync(rosterPath, 'utf8'));
          const bundleBytes = statSync(bundlePath).size;
          if (bundleBytes < 8000000) throw new Error('Combined-arms GLB missing or too small: ' + bundleBytes + ' bytes');
          if (roster.bundle.fullSceneGLBPath !== bundlePath) throw new Error('Roster does not point to the repository GLB bundle');
          if (roster.bundle.fullSceneGLBBytes !== bundleBytes) throw new Error('Roster GLB byte count does not match committed file');
          if (roster.schemaVersion !== 1) throw new Error('Unexpected roster schema');
          if (!Array.isArray(roster.vehicles) || roster.vehicles.length !== 31) throw new Error('Expected 31 active Blender vehicle and aircraft classes');
          const fixedWing = roster.vehicles.filter((u) => u.category === 'fixed_wing_aircraft');
          const rotaryWing = roster.vehicles.filter((u) => u.category === 'rotary_wing_aircraft');
          const groundVehicles = roster.vehicles.filter((u) => !['fixed_wing_aircraft','rotary_wing_aircraft'].includes(u.category));
          if (fixedWing.length !== 2 || rotaryWing.length !== 2 || groundVehicles.length !== 27) throw new Error('Airframe/ground classes are not separated (expected 2 fixed-wing, 2 rotary-wing, 27 ground)');
          if (!Array.isArray(roster.maps) || roster.maps.length !== 4) throw new Error('Expected four Blender-authored large map roots');
          if (!roster.infantry || !Array.isArray(roster.infantry.instances) || roster.infantry.instances.length !== 24) throw new Error('Expected 24 infantry scene prototypes');
          if (!Array.isArray(roster.infantry.archetypes) || roster.infantry.archetypes.length !== 18) throw new Error('Expected 18 infantry archetypes');
          const roots = [...roster.vehicles.map((u) => u.root), ...roster.infantry.instances.map((u) => u.sourceRoot), ...roster.maps.map((u) => u.root)];
          if (new Set(roots).size !== roots.length) throw new Error('Duplicate asset root identifiers');
          const glb = readFileSync(bundlePath);
          if (glb.readUInt32LE(0) !== 0x46546c67) throw new Error('Combined asset bundle is not a GLB file');
          if (glb.readUInt32LE(4) !== 2) throw new Error('Unexpected glTF binary version');
          const jsonChunkLength = glb.readUInt32LE(12);
          const gltf = JSON.parse(glb.toString('utf8', 20, 20 + jsonChunkLength).trim());
          const nodeNames = new Set((gltf.nodes || []).map((node) => node.name).filter(Boolean));
          const missingRoots = roots.filter((name) => !nodeNames.has(name));
          if (missingRoots.length) throw new Error('Missing named roots in GLB: ' + missingRoots.slice(0, 12).join(', '));
          console.log('Validated GLB magic/version and ' + roots.length + ' named roster roots.');
          if (!String(roster.integrationStatus || '').includes('revision-19')) throw new Error('Roster must identify its Blender source revision');
          if (roster.vehicles.some((u) => !u.status || !u.root || !u.category)) throw new Error('Every vehicle must have a status, category and Blender root');
          if (roster.infantry.instances.some((u) => !u.status || !u.sourceRoot)) throw new Error('Every infantry instance must have a status and Blender root');
          if (roster.maps.some((u) => !u.root || !u.terrainDimensionsM)) throw new Error('Every battlefield map must have a Blender root and metre dimensions');
          const requiredHtml = [
            '<div id="stage"',
            '<canvas id="minimap"',
            'id="catalogToggle"',
            'id="catalogOverlay"',
            'id="mapSelector"',
            'src="./game.js"',
            'three/addons/'
          ];
          const requiredGame = [
            'function launchAirstrike(',
            'function returnAircraft(',
            'function updatePlane(',
            'function updateTanks(',
            'function resetMission(',
            'const MAPS = {',
            'function applyBattlefieldMap(',
            'function createInfantry(',
            'function launchShell(',
            'function updateProjectiles(',
            'function updateInfantry(',
            'function crashAircraft(',
            'function createImpactMark(',
            'function bindBlenderRuntimeAssets(',
            'function installBlenderMap(',
            'function buildMapLayout(',
            'function updateAircraftRigMotion(',
            'function spawnGuidedMissile(',
            'window.__WARFRONT_DIAGNOSTICS__',
            'async function loadRosterManifest(',
            'function populateRosterCatalog(',
            'async function loadBlenderAssetBundle(',
            'async function previewBlenderAsset(',
            'function clearAssetPreview(',
            'setupCatalogDialog();',
            'AnimationMixer',
            'GLTFLoader'
          ];
          for (const item of requiredHtml) {
            if (!html.includes(item)) throw new Error('Missing HTML contract: ' + item);
          }
          for (const item of requiredGame) {
            if (!js.includes(item)) throw new Error('Missing gameplay contract: ' + item);
          }
          for (const path of [htmlPath, jsPath, rosterPath, bundlePath]) {
            if (statSync(path).size < 5000) throw new Error('Unexpectedly small file: ' + path);
          }
          console.log('Warfront standalone shell and M0 feature contracts are present.');
          NODE
      - name: Check whitespace errors
        run: git diff --check
      - name: Install isolated Chromium test runner
        run: npm install --prefix mcp --no-audit --no-fund
      - name: Start local Warfront preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory public/warfront > /tmp/warfront-preview.log 2>&1 &
          echo $! > /tmp/warfront-preview.pid
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4174/index.html >/dev/null; then
              echo "Warfront static preview is responding."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/warfront-preview.log
          exit 1
      - name: Test Warfront on desktop and mobile Chromium
        env:
          WARFRONT_URL: http://127.0.0.1:4174/index.html
          WARFRONT_ARTIFACTS: ${{ runner.temp }}/warfront-browser-qa
        run: node mcp/warfront-browser-smoke.mjs
      - name: Upload Warfront screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warfront-browser-qa
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/warfront-browser-qa/
            /tmp/warfront-preview.log
