name: Warfront RTS smoke checks

on:
  push:
    paths:
      - "public/warfront/**"
      - ".github/workflows/warfront-smoke.yml"
  pull_request:
    paths:
      - "public/warfront/**"
      - ".github/workflows/warfront-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke:
    name: Static contract and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate ES module syntax
        run: node --check public/warfront/game.js
      - name: Verify the standalone page contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          const htmlPath = 'public/warfront/index.html';
          const jsPath = 'public/warfront/game.js';
          const rosterPath = 'public/warfront/roster.json';
          const bundlePath = 'public/warfront/assets/combined-arms-r8.glb';
          const html = readFileSync(htmlPath, 'utf8');
          const js = readFileSync(jsPath, 'utf8');
          const roster = JSON.parse(readFileSync(rosterPath, 'utf8'));
          const bundleBytes = statSync(bundlePath).size;
          if (bundleBytes < 8000000) throw new Error('Combined-arms GLB missing or too small: ' + bundleBytes + ' bytes');
          if (roster.bundle.fullSceneGLBPath !== bundlePath) throw new Error('Roster does not point to the repository GLB bundle');
          if (roster.bundle.fullSceneGLBBytes !== bundleBytes) throw new Error('Roster GLB byte count does not match committed file');
          if (roster.schemaVersion !== 1) throw new Error('Unexpected roster schema');
          if (!Array.isArray(roster.vehicles) || roster.vehicles.length !== 28) throw new Error('Expected 28 Blender vehicle/aircraft roots');
          if (!roster.infantry || !Array.isArray(roster.infantry.instances) || roster.infantry.instances.length !== 24) throw new Error('Expected 24 infantry scene prototypes');
          if (!Array.isArray(roster.infantry.archetypes) || roster.infantry.archetypes.length !== 18) throw new Error('Expected 18 infantry archetypes');
          const roots = [...roster.vehicles.map((u) => u.root), ...roster.infantry.instances.map((u) => u.sourceRoot)];
          if (new Set(roots).size !== roots.length) throw new Error('Duplicate asset root identifiers');
          const glb = readFileSync(bundlePath);
          if (glb.readUInt32LE(0) !== 0x46546c67) throw new Error('Combined asset bundle is not a GLB file');
          if (glb.readUInt32LE(4) !== 2) throw new Error('Unexpected glTF binary version');
          const jsonChunkLength = glb.readUInt32LE(12);
          const gltf = JSON.parse(glb.toString('utf8', 20, 20 + jsonChunkLength).trim());
          const nodeNames = new Set((gltf.nodes || []).map((node) => node.name).filter(Boolean));
          const missingRoots = roots.filter((name) => !nodeNames.has(name));
          if (missingRoots.length) throw new Error('Missing named roots in GLB: ' + missingRoots.slice(0, 12).join(', '));
          console.log('Validated GLB magic/version and ' + roots.length + ' named roster roots.');
          if (roster.integrationStatus !== 'full-scene-glb-available-root-preview-supported-individual-unit-packaging-and-gameplay-binding-pending') throw new Error('Roster integration status must stay explicit');
          if (roster.vehicles.some((u) => u.status !== 'blender_prototype' || !u.root)) throw new Error('Every vehicle must have an explicit prototype status and Blender root');
          if (roster.infantry.instances.some((u) => u.status !== 'blender_prototype' || !u.sourceRoot)) throw new Error('Every infantry instance must have an explicit prototype status and Blender root');
          const requiredHtml = [
            '<div id="stage"',
            '<canvas id="minimap"',
            'id="catalogToggle"',
            'id="catalogOverlay"',
            'id="mapSelector"',
            'src="./game.js"',
            'three/addons/'
          ];
          const requiredGame = [
            'function launchAirstrike(',
            'function returnAircraft(',
            'function updatePlane(',
            'function updateTanks(',
            'function resetMission(',
            'const MAPS = {',
            'function applyBattlefieldMap(',
            'function createInfantry(',
            'function launchShell(',
            'function updateProjectiles(',
            'function updateInfantry(',
            'function crashAircraft(',
            'function createImpactMark(',
            'async function loadRosterManifest(',
            'function populateRosterCatalog(',
            'async function loadBlenderAssetBundle(',
            'async function previewBlenderAsset(',
            'function clearAssetPreview(',
            'setupCatalogDialog();',
            'AnimationMixer',
            'GLTFLoader'
          ];
          for (const item of requiredHtml) {
            if (!html.includes(item)) throw new Error('Missing HTML contract: ' + item);
          }
          for (const item of requiredGame) {
            if (!js.includes(item)) throw new Error('Missing gameplay contract: ' + item);
          }
          for (const path of [htmlPath, jsPath, rosterPath, bundlePath]) {
            if (statSync(path).size < 5000) throw new Error('Unexpectedly small file: ' + path);
          }
          console.log('Warfront standalone shell and M0 feature contracts are present.');
          NODE
      - name: Check whitespace errors
        run: git diff --check
