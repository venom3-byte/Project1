name: Forge Studio Proof
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-proof-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-syntax.mjs
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-syntax-report
          path: forge-syntax-report.json
          if-no-files-found: ignore
      - name: Core + visual + export acceptance
        run: npm run test:core
      - name: Full regression suite
        run: npm run test:forge
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
