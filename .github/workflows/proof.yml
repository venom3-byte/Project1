name: Forge Studio Proof
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-syntax.mjs
      - name: Run Forge boot regression suite
        run: npm run test:boot
      - run: npm run test:forge
      - name: Run mobile studio smoke
        run: npm run test:mobile
      - name: Upload Forge QA report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
