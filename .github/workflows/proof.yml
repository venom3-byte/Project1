name: Asset Forge Proof Image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: npx playwright test tests/smoke.spec.mjs --grep "real white-background sprite sheet"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-forge-proof-image
          path: tests/verified/real-sprite-cropped.png
          if-no-files-found: error
      - name: Publish proof image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C proof-image
          git add tests/verified/real-sprite-cropped.png
          git diff --cached --quiet || git commit -m "Publish verified proof image"
          git push --force origin proof-image
