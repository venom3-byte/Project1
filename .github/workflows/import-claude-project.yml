name: Restore Claude Game Editor source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-claude-project.yml"
permissions:
  contents: write
jobs:
  import-source:
    if: github.event.head_commit.message == 'chore: bootstrap Claude Game Editor import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch and extract the original source archive
        shell: bash
        run: |
          set -euo pipefail
          archive_url='https://assets.macaly-user-data.dev/krejgsf8oalserz1lhd45fy0/r06pdypbhojqest3cylj93hy/uA7LnhEi56nuP85bvqgog/claude-game-editor-full-source-E5Pe_Wwu.zip'
          curl --fail --location --retry 3 --retry-delay 2 "$archive_url" -o /tmp/claude-game-editor.zip
          mkdir -p /tmp/claude-game-editor
          unzip -q /tmp/claude-game-editor.zip -d /tmp/claude-game-editor
          if [ -f /tmp/claude-game-editor/package.json ]; then
            source_root=/tmp/claude-game-editor
          else
            source_package="$(find /tmp/claude-game-editor -mindepth 2 -maxdepth 4 -type f -name package.json -print -quit)"
            test -n "$source_package"
            source_root="$(dirname "$source_package")"
          fi
          test -f "$source_root/src/editor/EditorView.tsx"
          test -f "$source_root/src/routes/index.tsx"
          test -f "$source_root/package-lock.json"
          echo "Source root: $source_root"
          echo "Source files: $(find "$source_root" -type f -not -path '*/node_modules/*' | wc -l)"
          rsync -a --delete --exclude='.git' "$source_root/" ./
          rm -f .github/workflows/import-claude-project.yml
          test -f package.json
          test -f src/editor/EditorView.tsx
      - name: Commit the unmodified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes found"; exit 1; } || true
          git commit -m "chore: import Claude Game Editor source as-is"
          git push origin HEAD:main
