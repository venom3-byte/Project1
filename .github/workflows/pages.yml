name: Forge Studio Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Syntax validation
        run: node scripts/validate-syntax.mjs
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pages-syntax-report
          path: forge-syntax-report.json
          if-no-files-found: ignore
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Forge core acceptance
        run: npm run test:core
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pages-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
