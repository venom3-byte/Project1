name: Asset Forge CI & Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: asset-forge-run-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: asset-forge-verification
          path: tests/verified/
          if-no-files-found: error

  vision:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npx playwright install chromium
      - name: Install vision dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r vision-control/requirements.txt
      - name: Start Asset Forge server
        run: |
          nohup npm start > /tmp/asset-forge-server-vision.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/asset-forge-server-vision.log
          exit 1
      - name: Run hybrid visual QA
        run: python vision-control/qa_asset_forge.py http://127.0.0.1:4173/
      - name: Upload vision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-forge-vision-evidence
          path: |
            tests/vision-verified/
            /tmp/asset-forge-server-vision.log
          if-no-files-found: warn

  publish-verification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: asset-forge-verification
          path: tests/verified
      - name: Publish verified raster outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C verification-artifacts
          git add tests/verified
          git diff --cached --quiet || git commit -m "Publish verified raster outputs"
          git push --force origin verification-artifacts

  refresh-source-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, vision, publish-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild complete source text
        shell: bash
        run: |
          {
            echo 'ASSET FORGE STUDIO — CURRENT FULL SOURCE SNAPSHOT'
            echo 'Repository: venom3-byte/Project1'
            echo "Commit snapshot: $GITHUB_SHA"
            echo "Generated by workflow run: $GITHUB_RUN_ID"
            echo 'CI prerequisite jobs: SUCCESS'
            echo 'This file is generated from the tracked text source files. Binary/generated outputs are excluded.'
            echo
            for f in .github/workflows/pages.yml .github/workflows/proof.yml README.md app.js demo.html index.html live-vision.css live-vision.js manifest.webmanifest package.json playwright.config.mjs pro.css pro.js server.mjs styles.css tests/smoke.spec.mjs vision-control/README.md vision-control/qa_asset_forge.py vision-control/requirements.txt vision-control/vision_agent.py
          do
              echo "===== FILE: $f ====="
              cat "$f"
              echo
            done
          } > PROJECT-CODE-FULL.txt
      - name: Commit current source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT-CODE-FULL.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh complete source snapshot [skip ci]"
          git push origin HEAD:main

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
