name: Forge Eye cloud-first safety checks

on:
  push:
    branches:
      - forge-eye-cloud-first
    paths:
      - "public/forge/**"
      - "src/**"
      - "server/**"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forge-eye-cloud-safety-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "public/forge/**"
      - "src/**"
      - "server/**"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  mobile-safety-build-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install locked application dependencies
        run: npm ci
      - name: Build the full web app
        run: npm run build
      - name: Run existing unit tests
        run: npm test
      - name: Parse Forge engine JavaScript
        run: node --check public/forge/forge-engine.js
      - name: Verify mobile resource safeguards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('public/forge/forge-engine.js', 'utf8');
          const required = [
            "powerPreference:this.mobileMode?'low-power':'default'",
            'graphicsDevice.maxPixelRatio=this.mobileMode?1:',
            "document.addEventListener('visibilitychange',this.onVisibilityChange)",
            'if(!document.hidden)this.update(dt)',
            'castShadows:!this.mobileMode'
          ];
          const missing = required.filter((snippet) => !source.includes(snippet));
          if (missing.length) {
            console.error('Missing phone-safety safeguards:', missing);
            process.exit(1);
          }
          console.log('All phone-safety safeguards are present.');
          NODE
      - name: Install browser smoke-test dependencies
        run: npm install --prefix mcp --no-package-lock
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/forge-preview.log 2>&1 &
          echo $! > /tmp/forge-preview.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Production preview is responding."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/forge-preview.log
          exit 1
      - name: Run real Chromium desktop and mobile smoke test
        run: node mcp/forge-port-smoke.mjs
        env:
          FORGE_PORT_URL: http://127.0.0.1:4173/
          FORGE_PORT_ARTIFACTS: artifacts/forge-port
      - name: Test Forge Eye AI Studio in Chromium
        run: node mcp/forge-eye-ai-studio-smoke.mjs
        env:
          FORGE_EYE_URL: http://127.0.0.1:4173/forge/ai-studio.html
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-eye-browser-smoke
          path: artifacts/forge-port/
          if-no-files-found: warn
