[workspace]
members = [
    "forge-eye/crates/forge-eye-core",
    "forge-eye/crates/forge-eye-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2.129"
