plugins {
  id "com.android.application"
}

def forgeAndroidFile = rootProject.file("forge-android.properties.json")
def forgeAndroid = forgeAndroidFile.exists()
  ? new groovy.json.JsonSlurper().parse(forgeAndroidFile)
  : [:]

android {
  buildFeatures { buildConfig true }
  namespace "com.venom3byte.forgegame"
  compileSdk (forgeAndroid.compileSdk ?: 37)

  defaultConfig {
    applicationId (forgeAndroid.applicationId ?: "com.venom3byte.forgegame")
    minSdk (forgeAndroid.minSdk ?: 24)
    targetSdk (forgeAndroid.targetSdk ?: 37)
    versionCode (forgeAndroid.versionCode ?: 1)
    versionName (forgeAndroid.versionName ?: "0.1.0")
    resValue "string", "app_name", forgeAndroid.appName ?: "Forge Game"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildTypes {
    debug {
      debuggable true
      minifyEnabled false
    }
    release {
      debuggable false
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.17.1"
}
