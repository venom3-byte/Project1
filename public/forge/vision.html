<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>Forge Live Vision — Eyes + Hands</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#050b12;color:#e8f1ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% -10%,#153553 0,#07111e 45%,#04080d 100%);padding:18px}
.app{max-width:1400px;margin:auto}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:19px;letter-spacing:.7px}p{margin:3px 0 0;color:#7f96ae;font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
button,input{font:inherit}
button{border:1px solid #2b4c69;background:#0b1928;color:#e8f1ff;border-radius:9px;padding:8px 11px;cursor:pointer}
button.primary{background:#16466d;border-color:#3b7db4}
button.danger{border-color:#6d3641;color:#ff9ba5}
button:disabled{opacity:.45;cursor:not-allowed}
.badge{font-size:11px;padding:7px 9px;border-radius:999px;background:#0b1623;border:1px solid #20374f;color:#8da7bf}
.badge.live{color:#7cf0aa;border-color:#265f46}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}
.card{background:#07111ce8;border:1px solid #1c344c;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px #0007}
.viewer{position:relative;background:#02060b;min-height:560px;display:grid;place-items:center;overflow:hidden}
#stream{display:block;width:100%;height:auto;max-height:calc(100vh - 170px);object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none;background:#010307}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#6e8399;text-align:center;padding:24px}
.overlay{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.overlay span{background:#020914cc;border:1px solid #28435b;border-radius:8px;padding:6px 8px;font:11px/1.2 ui-monospace,monospace;color:#a5bad0}
.side{padding:12px}
.section{border-top:1px solid #173049;padding-top:11px;margin-top:11px}
.section:first-child{border-top:0;padding-top:0;margin-top:0}
label{display:block;color:#8fa7bf;font-size:11px;margin-bottom:7px}
input[type=text]{width:100%;padding:8px 9px;border:1px solid #27445e;background:#040c14;color:#e8f1ff;border-radius:8px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:7px;font-size:11px;margin:7px 0}
small{color:#6f869e}
#log{height:290px;overflow:auto;background:#030a12;border:1px solid #173049;border-radius:9px;padding:8px;font:10px/1.45 ui-monospace,monospace}
log{}
.line{padding:3px 0;border-bottom:1px solid #0f2030;white-space:pre-wrap;word-break:break-word}
.ok{color:#79edaa}.warn{color:#f2ca72}.err{color:#ff8490}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:10px/1.4 ui-monospace,monospace;color:#9db2c8}
@media(max-width:900px){body{padding:8px}.grid{grid-template-columns:1fr}.viewer{min-height:52vh}.side{order:2}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>FORGE LIVE VISION</h1><p>Continuous screencast + real mouse, keyboard, touch and wheel control</p></div>
  <div class="controls">
    <span id="badge" class="badge">No session</span>
    <button id="start" class="primary">Start Forge session</button>
    <button id="stop" class="danger" disabled>Stop</button>
  </div>
</header>
<div class="grid">
  <section class="card viewer" id="viewer" tabindex="0" aria-label="Live remote viewport">
    <img id="stream" alt="Live Forge viewport stream" draggable="false">
    <div id="empty" class="empty"><div><strong>Live session not started</strong><br><small>Start the Forge-controlled browser session to receive continuous frames.</small></div></div>
    <div class="overlay"><span id="fps">0 fps</span><span id="seq">frame 0</span></div>
  </section>
  <aside class="card side">
    <div class="section">
      <label>Target URL</label>
      <input id="target" type="text" value="/">
      <div class="check"><input id="touch" type="checkbox"> <span>mobile/touch session</span></div>
      <div class="row"><button id="focus" disabled>Focus remote</button><button id="state" disabled>Read state</button><button id="elements" disabled>Hit targets</button></div>
    </div>
    <div class="section"><pre id="stateView">{}</pre></div>
    <div class="section"><div id="log"></div></div>
  </aside>
</div>
<script type="module">
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ws=null,session=null,moveTimer=null,lastPointer=null,lastTouchId=1;
const log=(text,kind='')=>{const row=document.createElement('div');row.className='line '+kind;row.textContent=new Date().toLocaleTimeString()+'  '+text;$('log').prepend(row);while($('log').children.length>80)$('log').lastElementChild.remove()};
function endpoint(p){return location.origin+p}
function post(path,data={}){return fetch(endpoint(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(async r=>{const j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'request failed');return j})}
function setLive(on){$('badge').textContent=on?'LIVE':'No session';$('badge').classList.toggle('live',on);$('start').disabled=on;$('stop').disabled=!on;['focus','state','elements'].forEach(id=>$(id).disabled=!on);$('empty').style.display=on?'none':'grid'}
function connect(){
  if(ws&&ws.readyState<=1)return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(proto+'//'+location.host+'/vision');
  ws.onopen=()=>{ws.send(JSON.stringify({type:'hello'}));log('Vision control WebSocket connected','ok')};
  ws.onclose=()=>{log('Vision control WebSocket closed','warn');ws=null};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='vision-frame'){renderStatus(m)}else if(m.type==='vision-hello'){renderStatus(m.session)}else if(m.type==='action-result'){if(m.ok)log('Action accepted · frame '+m.afterFrame,'ok');else log('Action failed · '+m.error,'err')}};
}
function renderStatus(s){if(!s)return;session=s;$('fps').textContent=(s.fps||0)+' fps';$('seq').textContent='frame '+(s.frameSeq||0);setLive(!!s.running);if(s.running){$('stream').src=endpoint('/api/vision/stream?session='+(s.sessionId||'')+'&t='+Date.now())}}
async function refresh(){try{const j=await fetch(endpoint('/api/vision/status'),{cache:'no-store'}).then(r=>r.json());renderStatus(j.vision)}catch{}}
async function start(){
  try{
    connect();
    const opts={target:$('target').value.trim()||'/',viewport:{width:$('touch').checked?390:1440,height:$('touch').checked?844:900},touch:$('touch').checked,mobile:$('touch').checked};
    const j=await post('/api/vision/session/start',opts);renderStatus(j.session);log('Session started · '+j.session.targetUrl,'ok');
  }catch(e){log(e.message,'err')}
}
async function stop(){try{await post('/api/vision/session/stop');setLive(false);$('stream').removeAttribute('src');log('Session stopped','warn')}catch(e){log(e.message,'err')}}
function remotePoint(ev){
  const img=$('stream'),r=img.getBoundingClientRect(),v=session?.viewport||{width:1440,height:900};
  const iw=img.naturalWidth||v.width,ih=img.naturalHeight||v.height;
  const scale=Math.min(r.width/Math.max(1,iw),r.height/Math.max(1,ih));
  const dw=iw*scale,dh=ih*scale,ox=(r.width-dw)/2,oy=(r.height-dh)/2;
  return{x:Math.max(0,Math.min(v.width-1,(ev.clientX-r.left-ox)/Math.max(.0001,scale))),y:Math.max(0,Math.min(v.height-1,(ev.clientY-r.top-oy)/Math.max(.0001,scale)))}
}
function send(action){
  if(!ws||ws.readyState!==1)return;
  const id=crypto.randomUUID();ws.send(JSON.stringify({type:'action',id,action}));
}
$('stream').addEventListener('pointerdown',e=>{
  $('viewer').focus();const p=remotePoint(e);lastPointer=p;
  if(e.pointerType==='touch')send({type:'touch.start',points:[{id:lastTouchId,x:p.x,y:p.y,force:1}]});
  else send({type:'mouse.down',button:e.button===2?'right':e.button===1?'middle':'left'});
  e.preventDefault();
});
$('stream').addEventListener('pointermove',e=>{
  const p=remotePoint(e);lastPointer=p;
  if(e.pointerType==='touch')send({type:'touch.move',points:[{id:lastTouchId,x:p.x,y:p.y,force:1}]});
  else{
    clearTimeout(moveTimer);moveTimer=setTimeout(()=>send({type:'mouse.move',x:p.x,y:p.y,steps:1}),16);
  }
  e.preventDefault();
});
$('stream').addEventListener('pointerup',e=>{
  const p=remotePoint(e);lastPointer=p;
  if(e.pointerType==='touch')send({type:'touch.end'});
  else send({type:'mouse.up',button:e.button===2?'right':e.button===1?'middle':'left'});
  e.preventDefault();
});
$('stream').addEventListener('wheel',e=>{
  send({type:'mouse.move',x:remotePoint(e).x,y:remotePoint(e).y});
  send({type:'mouse.wheel',deltaX:e.deltaX,deltaY:e.deltaY});
  e.preventDefault();
},{passive:false});
$('viewer').addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target?.tagName))return;
  if(e.key===' ')e.preventDefault();
  send({type:'keyboard.press',key:e.ctrlKey?'Control+'+e.key:e.shiftKey?'Shift+'+e.key:e.altKey?'Alt+'+e.key:e.key});
});
$('viewer').addEventListener('contextmenu',e=>e.preventDefault());
$('start').onclick=start;$('stop').onclick=stop;
$('focus').onclick=()=>send({type:'focus'});
$('state').onclick=async()=>{try{const j=await fetch(endpoint('/api/vision/state'),{cache:'no-store'}).then(r=>r.json());$('stateView').textContent=JSON.stringify(j,null,2)}catch(e){log(e.message,'err')}};
$('elements').onclick=async()=>{try{const j=await fetch(endpoint('/api/vision/elements'),{cache:'no-store'}).then(r=>r.json());$('stateView').textContent=JSON.stringify(j,null,2)}catch(e){log(e.message,'err')}};
setInterval(refresh,750);connect();refresh();
</script>
</body>
</html>
