<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Asset Forge Studio</title><link rel="stylesheet" href="./styles.css?v=1"><script src="https://cdn.jsdelivr.net/npm/fabric@7.4.0/dist/index.min.js"></script></head><body><div id="app"><header class="topbar"><div class="brand"><span class="brandmark">AF</span><div><strong>Asset Forge</strong><small>Game Asset Studio</small></div></div><div class="docname" id="docName">Untitled Asset</div><div class="top-actions"><button id="newBtn">New</button><button id="openBtn">Open</button><button id="saveBtn" class="primary">Save</button><button id="exportBtn">Export</button></div></header><main class="workspace"><aside class="sidebar left"><div class="panel-title">TOOLS</div><button class="tool active">↖ <span>Select</span></button><button class="tool" id="uploadBtn">＋ <span>Upload image</span></button><button class="tool" id="bgBtn">✦ <span>Remove background</span></button><button class="tool" id="cropBtn">⌗ <span>Crop</span></button><button class="tool" id="textBtn">T <span>Text</span></button><button class="tool" id="rectBtn">□ <span>Shape</span></button><button class="tool" id="duplicateBtn">▣ <span>Duplicate</span></button><div class="panel-title">CANVAS</div><label class="field">Width<input id="cw" type="number" min="1" max="8000" value="1024"></label><label class="field">Height<input id="ch" type="number" min="1" max="8000" value="1024"></label><button id="applySize">Apply size</button><div class="panel-title">SPRITES</div><label class="field">Columns<input id="cols" type="number" min="1" max="32" value="6"></label><label class="field">Rows<input id="rows" type="number" min="1" max="32" value="1"></label><button id="spriteBtn">Create sprite sheet</button></aside><section class="stage-wrap"><div class="stage-toolbar"><button id="undoBtn">↶</button><button id="redoBtn">↷</button><span class="divider"></span><button id="fitBtn">Fit</button><span id="zoomLabel">100%</span><span class="status" id="status">Ready</span></div><div class="stage" id="stage"><div class="checker"></div><canvas id="editorCanvas"></canvas><div id="dropHint">Drop an image here or use <b>Upload image</b></div></div><div class="bottom-info"><span id="dimensions">1024 × 1024</span><span>Raster workflow · no SVG assets</span></div></section><aside class="sidebar right"><div class="panel-title">PROPERTIES</div><div id="propsEmpty">Select an object to edit it.</div><div id="props" class="hidden"><label class="field">X<input id="px" type="number"></label><label class="field">Y<input id="py" type="number"></label><label class="field">W<input id="pw" type="number"></label><label class="field">H<input id="ph" type="number"></label><label class="field">Rotation<input id="prot" type="number"></label><label class="field">Opacity<input id="pop" type="range" min="0" max="1" step=".01"></label><div id="imageControls"><div class="panel-title">IMAGE</div><label class="field">Brightness<input id="brightness" type="range" min="-1" max="1" step=".01" value="0"></label><label class="field">Contrast<input id="contrast" type="range" min="-1" max="1" step=".01" value="0"></label><label class="field">Saturation<input id="saturation" type="range" min="-1" max="1" step=".01" value="0"></label><label class="field">Blur<input id="blur" type="range" min="0" max=".5" step=".01" value="0"></label><button id="resetFilters">Reset filters</button></div><button id="deleteBtn" class="danger">Delete selected</button></div><div class="panel-title">ASSET VAULT</div><div class="vault-actions"><button id="clearVaultBtn">Clear</button></div><div id="vault" class="vault"></div></aside></main><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/avif" hidden><input id="projectInput" type="file" accept=".json,application/json" hidden><div id="toast"></div></div><script type="module" src="./app.js?v=1"></script></body></html>
